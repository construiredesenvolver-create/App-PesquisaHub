# Mantém o banco Supabase (plano gratuito) acordado.
# O plano gratuito pausa o projeto após 7 dias sem uso; esta rotina faz uma
# consulta leve 2x por semana para evitar isso. Não precisa de nenhuma configuração.
name: Manter Supabase ativo

on:
  schedule:
    - cron: '0 12 * * 1,4' # segundas e quintas, 09:00 (horário de Brasília)
  workflow_dispatch: {}     # permite rodar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve ao banco
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://rooodkapcmolmnbcngws.supabase.co/rest/v1/app_settings?select=chave&limit=1" \
            -H "apikey: sb_publishable_Rv4o9w3bnGLi2s0URee_oA_eMLgsPkF")
          echo "Resposta do Supabase: $STATUS"
          test "$STATUS" = "200"
